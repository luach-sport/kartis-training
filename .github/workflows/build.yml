name: בדיקות ובניית APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) בדיקות: קוד רגיל + כללי האבטחה + זרימה מלאה מול אמולטור של Firebase
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      firebase_ready: ${{ steps.cfg.outputs.ready }}
    steps:
      - uses: actions/checkout@v5

      - name: Is the Firebase project connected?
        id: cfg
        run: |
          if [ -s android-config/google-services.json ] && grep -qE "apiKey: '[A-Za-z0-9_-]{10,}'" src/config/firebase-config.js; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase is not connected yet (google-services.json / firebase-config.js) — running tests only, no APK"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Security rules + full flow tests (Firebase emulator)
        run: npm run test:rules

  # 2) בנייה: אפליקציית ה-Web → פרויקט אנדרואיד → APK חתום → Release להורדה
  apk:
    needs: test
    if: needs.test.outputs.firebase_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION: '1.0'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}.${{ github.run_number }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Customize Android project
        run: bash scripts/patch-android.sh

      - name: Sync web app into Android
        run: npx cap sync android

      # מפתח אימון: הסיסמה כתובה כאן בגלוי בכוונה, כי זו אפליקציית אימון בלבד.
      # באפליקציה אמיתית שומרים אותה ב-GitHub Secrets ולא בקוד.
      - name: Build signed APK
        working-directory: android
        env:
          KARTIS_STORE_PASSWORD: kartis-training
          KARTIS_KEY_PASSWORD: kartis-training
          KARTIS_KEY_ALIAS: kartis
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../kartis.apk

      - name: Verify APK
        run: |
          ls -la kartis.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs kartis.apk | head -6
          "$BT/aapt" dump badging kartis.apk 2>/dev/null | grep -E "package|sdkVersion|targetSdk|application-label" | head -6 || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}-build${GITHUB_RUN_NUMBER}"
          NOTES=$'כרטיס (אימון) — גרסה '"${APP_VERSION}"$' (בנייה '"${GITHUB_RUN_NUMBER}"$')\n\nאפליקציית אימון: חשבונות בענן, התחברות עם Google, איפוס סיסמה במייל, סנכרון בין מכשירים. ההופעות והתשלומים מדומים.\n\nלהתקנה: מורידים את kartis.apk בטלפון ופותחים. בהתקנה הראשונה מאשרים "התקנה ממקור לא ידוע".'
          gh release create "$TAG" kartis.apk --title "כרטיס (אימון) ${APP_VERSION} · בנייה ${GITHUB_RUN_NUMBER}" --notes "$NOTES" --latest
